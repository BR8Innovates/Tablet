# Host on Fly.io:  fly launch --no-deploy --copy-config   then   fly volumes create fuel_data --size 1   then   fly secrets set SESSION_SECRET=$(openssl rand -hex 32)   then   fly deploy
app = "fuel-station-manager"          # change to a unique name
primary_region = "bom"                # Mumbai; pick the region nearest your station

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DATA_DIR = "/data"
  TRUST_PROXY = "1"

[mounts]
  source = "fuel_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"          # keep running so live sync stays connected
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
